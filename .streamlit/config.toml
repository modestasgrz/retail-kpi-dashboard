[theme]
base = "dark"
primaryColor = "#EDEDEF"
backgroundColor = "#0A0A0B"
secondaryBackgroundColor = "#111113"
textColor = "#EDEDEF"
greenColor = "#22C55E"
redColor = "#EF4444"
font = '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif'

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
headless = true
