[project]
name = "retail-kpi-dashboard"
version = "0.1.0"
description = "Weekly retail KPI dashboard over 53 weeks of the public UCI Online Retail II data."
readme = "README.md"
authors = [
    { name = "modestasgrz", email = "71698213+modestasgrz@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "streamlit==1.67.0",
]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = [".semgrep/fixtures"]

[tool.ruff.lint]
ignore = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true
mypy_path = "tests/security"
exclude = ["^\\.semgrep/", "^\\.claude/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "openpyxl>=3.1.5",
    "pandas-stubs>=3.1.0.261029",
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "starlette>=1.10.0",
]
